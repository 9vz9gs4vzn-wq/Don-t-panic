<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#070910"><title>PANIC BUTTON — Build 2</title><style>
:root{--bg:#070910;--panel:#111522;--text:#fff;--muted:#8992a7;--good:#6cff9b;--bad:#ff416c;--warn:#ffd45c;--accent:#8a6cff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:manipulation}body{display:flex;justify-content:center}.app{width:min(100vw,580px);height:100dvh;display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),6px) 13px max(env(safe-area-inset-bottom),4px)}.top{height:84px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.stat{font-size:10px;color:var(--muted);letter-spacing:.16em}.stat b{display:block;color:#fff;font-size:25px;letter-spacing:0}.right{text-align:right}.logo{font-weight:1000;font-size:13px;letter-spacing:.22em}.arena{flex:1;min-height:0;position:relative;border:1px solid #252b3e;border-radius:28px;background:radial-gradient(circle at 50% 25%,#1c2134,#0d1019 48%,#080910 85%);overflow:hidden;box-shadow:inset 0 18px 70px #0008}.rule{position:absolute;z-index:5;top:13px;left:13px;right:13px;height:86px;border:1px solid #333a53;border-radius:21px;background:#0c0f18e8;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 14px;font-size:25px;font-weight:1000}.rule small{display:block;font-size:10px;color:var(--muted);letter-spacing:.15em;margin-bottom:5px}.grid{position:absolute;inset:112px 13px 13px;display:grid;gap:9px}.btn{position:relative;border:0;border-radius:21px;background:#1a2030;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:clamp(16px,5.7vw,30px);min-width:0;min-height:0;box-shadow:0 7px 20px #0005,inset 0 0 0 1px #ffffff12;transition:transform .07s}.btn:active{transform:scale(.94)!important}.overlay{position:absolute;inset:0;z-index:30;background:#05060bed;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center}.hidden{display:none}.card{width:100%;max-width:430px}.title{font-size:clamp(48px,14vw,80px);font-weight:1000;line-height:.82;letter-spacing:-.065em;margin:0}.accent{color:var(--warn)}.sub{color:#b2b9ca;line-height:1.48;margin:19px auto 22px;max-width:360px}.cta{width:100%;height:64px;border:0;border-radius:20px;background:#fff;color:#080910;font-size:18px;font-weight:1000}.secondary{margin-top:10px;background:#1b2030;color:#fff}.tiny{font-size:10px;color:#727b90;margin-top:13px;line-height:1.5}.flash{position:absolute;inset:0;z-index:12;pointer-events:none;opacity:0}.flash.good{background:#6cff9b35;animation:flash .2s}.flash.bad{background:#ff416c4d;animation:flash .27s}@keyframes flash{0%{opacity:1}100%{opacity:0}}.toast{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:15;font-size:clamp(42px,15vw,84px);font-weight:1000;opacity:0;pointer-events:none;text-shadow:0 7px 25px #000}.toast.go{animation:pop .55s}@keyframes pop{0%{opacity:1;transform:translate(-50%,-50%) scale(.65)}60%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}.bottom{height:68px;display:flex;align-items:center;color:var(--muted);font-size:10px;letter-spacing:.08em;padding:0 5px}.meter{height:8px;flex:1;background:#191d2b;border-radius:9px;overflow:hidden;margin:0 10px}.meter i{display:block;width:100%;height:100%;background:#fff;transform-origin:left}.shake{animation:shake .2s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.combo{position:absolute;right:18px;top:106px;z-index:8;font-size:11px;font-weight:900;color:var(--warn);opacity:0}.combo.on{opacity:1}.danger{animation:pulse .38s infinite alternate}@keyframes pulse{to{box-shadow:inset 0 0 50px #ff416c18}}.fake{position:absolute;z-index:9;padding:12px 16px;border-radius:15px;background:#ff416c;color:#fff;font-weight:1000;pointer-events:none;animation:fake .65s forwards}@keyframes fake{0%{opacity:0;transform:scale(.6)}25%,75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.2)}}
</style></head><body><div class="app" id="app"><div class="top"><div class="stat">SCORE<b id="score">0</b></div><div class="logo">PANIC BUTTON</div><div class="stat right">BEST<b id="best">0</b></div></div><main class="arena" id="arena"><div class="rule"><div><small id="ruleSmall">DO EXACTLY THIS</small><span id="ruleText">TAP START</span></div></div><div class="combo" id="combo"></div><div class="grid" id="grid"></div><div class="flash" id="flash"></div><div class="toast" id="toast"></div><div class="overlay" id="overlay"><div class="card" id="card"><h1 class="title">PANIC<br><span class="accent">BUTTON</span></h1><p class="sub">Read the rule. Hit the right button. Don't let the game get inside your head.</p><button class="cta" id="start">TAP TO PANIC</button><div class="tiny">BUILD 2 • faster • nastier • one-more-go engineered</div></div></div></main><div class="bottom"><span id="level">PANIC 1</span><div class="meter"><i id="timer"></i></div><span id="lives">♥♥♥</span></div></div><script>
(()=>{const $=s=>document.querySelector(s),grid=$('#grid'),scoreEl=$('#score'),bestEl=$('#best'),ruleText=$('#ruleText'),ruleSmall=$('#ruleSmall'),overlay=$('#overlay'),card=$('#card'),timerEl=$('#timer'),livesEl=$('#lives'),levelEl=$('#level'),flash=$('#flash'),toast=$('#toast'),app=$('#app'),arena=$('#arena'),comboEl=$('#combo');let score=0,best=+(localStorage.pbBest||0),lives=3,deadline=0,duration=2600,tick,answer='',buttons=[],streak=0,locked=true,noTap=false;bestEl.textContent=best;const words=['RED','BLUE','GREEN','YELLOW','LEFT','RIGHT','UP','DOWN','YES','NO','GO','STOP','ONE','TWO','THREE','FOUR'],symbols=['▲','●','■','★','◆','✚','☀','☾','⚡','♥','♠','♣','♦'];const rand=a=>a[Math.floor(Math.random()*a.length)],shuffle=a=>[...a].sort(()=>Math.random()-.5);function vibrate(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}function stage(){return score<10?1:score<25?2:score<50?3:4}function round(){locked=false;noTap=false;clearInterval(tick);const panic=stage(),count=Math.min(16,4+Math.floor(score/4));duration=Math.max(680,2750-score*36);levelEl.textContent='PANIC '+panic;arena.classList.toggle('danger',panic>=3);const cols=Math.ceil(Math.sqrt(count));grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;grid.style.gridTemplateRows=`repeat(${Math.ceil(count/cols)},1fr)`;let pool=score<7?words:words.concat(symbols);buttons=shuffle(pool).slice(0,count);while(buttons.length<count)buttons.push(rand(pool));answer=rand(buttons);let modes=['NORMAL'];if(score>=7)modes.push('NOT');if(score>=12)modes.push('INDEX');if(score>=18)modes.push('POSITION');if(score>=25)modes.push('FLASH','SWAP');if(score>=35)modes.push('DOUBLE');const mode=rand(modes);ruleSmall.textContent=panic>=3?'DON’T PANIC':'DO EXACTLY THIS';if(mode==='NORMAL')ruleText.textContent=`TAP ${answer}`;if(mode==='NOT'){noTap=true;answer='';ruleText.textContent=`DON’T TAP`}if(mode==='INDEX'){const i=Math.floor(Math.random()*buttons.length);answer=buttons[i];ruleText.textContent=`TAP BUTTON #${i+1}`}if(mode==='POSITION'){const i=Math.random()<.5?0:buttons.length-1;answer=buttons[i];ruleText.textContent=i===0?'TAP TOP-LEFT':'TAP BOTTOM-RIGHT'}if(mode==='FLASH'){ruleText.textContent=`TAP ${answer} — IGNORE POPUPS`;setTimeout(fakePopup,220)}if(mode==='SWAP'){ruleText.textContent=`WAIT...`;setTimeout(()=>{if(!locked){answer=rand(buttons);ruleText.textContent=`NOW TAP ${answer}`}},Math.min(700,duration*.28))}if(mode==='DOUBLE'){ruleText.textContent=`TAP ${answer} — FAST`;duration=Math.max(620,duration*.78)}render(panic);deadline=performance.now()+duration;tick=setInterval(update,25)}function render(panic){grid.innerHTML='';buttons.forEach(x=>{const b=document.createElement('button');b.className='btn';b.textContent=x;if(panic>=2&&Math.random()<.2)b.style.transform=`rotate(${Math.floor(Math.random()*12-6)}deg)`;if(panic>=4&&Math.random()<.18)b.style.fontSize='14px';b.onclick=()=>tap(x);grid.appendChild(b)})}function tap(v){if(locked)return;if(noTap){miss();return}if(v===answer){locked=true;score++;streak++;scoreEl.textContent=score;if(score>best){best=score;localStorage.pbBest=best;bestEl.textContent=best}comboEl.textContent=streak>=3?`×${streak} STREAK`:'';comboEl.classList.toggle('on',streak>=3);fx('good');vibrate(18);say(streak===5?'HEATING UP':streak===10?'UNHINGED':score===25?'PANIC 25!':'✓');setTimeout(round,85)}else miss()}function miss(){if(locked)return;locked=true;lives--;streak=0;comboEl.classList.remove('on');livesEl.textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);fx('bad');vibrate([35,30,55]);say('NOPE');app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake');lives<=0?setTimeout(gameOver,260):setTimeout(round,260)}function update(){const left=Math.max(0,deadline-performance.now());timerEl.style.transform=`scaleX(${left/duration})`;if(left<=0){if(noTap)surviveNoTap();else miss()}}function surviveNoTap(){if(locked)return;locked=true;clearInterval(tick);score++;streak++;scoreEl.textContent=score;if(score>best){best=score;localStorage.pbBest=best;bestEl.textContent=best}comboEl.textContent=streak>=3?`×${streak} STREAK`:'';comboEl.classList.toggle('on',streak>=3);fx('good');vibrate(18);say('✓');setTimeout(round,85)}function fx(t){flash.className='flash '+t;setTimeout(()=>flash.className='flash',300)}function say(t){toast.textContent=t;toast.className='toast go';setTimeout(()=>toast.className='toast',570)}function fakePopup(){if(locked)return;const f=document.createElement('div');f.className='fake';f.textContent=rand(['TAP ME!','WRONG!','LOOK HERE','BONUS!']);f.style.left=(10+Math.random()*55)+'%';f.style.top=(28+Math.random()*45)+'%';arena.appendChild(f);setTimeout(()=>f.remove(),700)}function gameOver(){clearInterval(tick);locked=true;const record=score>=best&&score>0;overlay.classList.remove('hidden');card.innerHTML=`<h1 class="title">${record?'NEW BEST':'SCORE'}<br><span class="accent">${score}</span></h1><p class="sub">${score>=50?'You are a problem.':score>=25?'You broke into PANIC territory.':score>=10?'Your brain nearly kept up.':'The button won.'}<br><b>Best ${best}</b></p><button class="cta" id="again">AGAIN. NOW.</button><button class="cta secondary" id="challenge">CHALLENGE A FRIEND</button><div class="tiny">Next target: ${score<25?25:score<50?50:100} • same high score saved on this device</div>`;$('#again').onclick=begin;$('#challenge').onclick=share}async function share(){const text=`I survived PANIC BUTTON to ${score}. Beat my score.`;try{if(navigator.share)await navigator.share({title:'PANIC BUTTON',text});else{await navigator.clipboard.writeText(text);say('COPIED')}}catch(e){}}function begin(){score=0;lives=3;streak=0;locked=false;scoreEl.textContent=0;livesEl.textContent='♥♥♥';comboEl.classList.remove('on');overlay.classList.add('hidden');round()}$('#start').onclick=begin})();
</script></body></html>
