}levelEl.textContent='PANIC '+panic;arena.classList.toggle('danger',panic>=3);const cols=Math.ceil(Math.sqrt(count));grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;grid.style.gridTemplateRows=`repeat(${Math.ceil(count/cols)},1fr)`;let pool=score<7?words:words.concat(symbols);buttons=shuffle(pool).slice(0,count);while(buttons.length<count)buttons.push(rand(pool));answer=rand(buttons);let modes=['NORMAL'];if(score>=9)modes.push('NOT');if(score>=16)modes.push('INDEX');if(score>=24)modes.push('POSITION');if(score>=25)modes.push('FLASH','SWAP');if(score>=30)modes.push('FAKE_RULE');if(score>=35)modes.push('DOUBLE','ODD_ONE');if(score>=45)modes.push('GLITCH');const mode=rand(modes);ruleSmall.textContent=panic>=3?'DON’T PANIC':'DO EXACTLY THIS';if(mode==='NORMAL')ruleText.textContent=`TAP ${answer}`;if(mode==='NOT'){noTap=true;answer='';ruleText.textContent=`DON’T TAP`}if(mode==='INDEX'){const i=Math.floor(Math.random()*buttons.length);answer=buttons[i];ruleText.textContent=`TAP BUTTON #${i+1}`}if(mode==='POSITION'){const i=Math.random()<.5?0:buttons.length-1;answer=buttons[i];ruleText.textContent=i===0?'TAP TOP-LEFT':'TAP BOTTOM-RIGHT'}if(mode==='FLASH'){ruleText.textContent=`TAP ${answer} — IGNORE POPUPS`;setTimeout(fakePopup,220)}if(mode==='SWAP'){ruleText.textContent=`WAIT...`;setTimeout(()=>{if(!locked){answer=rand(buttons);ruleText.textContent=`NOW TAP ${answer}`;deadline=performance.now()+duration}},Math.min(700,duration*.28))}if(mode==='DOUBLE'){ruleText.textContent=`TAP ${answer} — FAST`;duration=Math.max(1400,duration*.96)}if(mode==='FAKE_RULE'){const real=answer;ruleText.textContent=`TAP ${rand(buttons)}`;setTimeout(()=>{if(!locked){answer=real;ruleText.textContent=`NO — TAP ${answer}`;deadline=performance.now()+duration;ruleText.parentElement.classList.add('glitch');setTimeout(()=>ruleText.parentElement.classList.remove('glitch'),350)}},Math.min(520,duration*.22))}if(mode==='ODD_ONE'){const i=Math.floor(Math.random()*buttons.length);answer=buttons[i];ruleText.textContent=`TAP BUTTON #${i+1} — DON'T THINK`}if(mode==='GLITCH'){ruleText.textContent=`TAP ${answer}`;app.classList.add('glitch');setTimeout(()=>app.classList.remove('glitch'),350)}render(panic);breakMachine();deadline=performance.now()+duration;tick=setInterval(update,25)}function render(panic){grid.innerHTML='';buttons.forEach(x=>{const b=document.createElement('button');b.className='btn';b.textContent=x;if(panic>=2&&Math.random()<.2)b.style.transform=`rotate(${Math.floor(Math.random()*12-6)}deg)`;if(panic>=4&&Math.random()<.18)b.style.fontSize='14px';b.onclick=()=>tap(x);grid.appendChild(b)})}function tap(v){if(locked)return;sfx('tap');haptic('tap');if(noTap){miss();return}if(v===answer){locked=true;score++;streak++;scoreEl.textContent=score;if(score>best){best=score;localStorage.pbBest=best;bestEl.textContent=best}milestoneLife();comboEl.textContent=streak>=3?`×${streak} STREAK`:'';comboEl.classList.toggle('on',streak>=3);fx('good');sfx('good');haptic('good');say(streak===5?'HEATING UP':streak===10?'UNHINGED':'✓');setTimeout(round,85)}else miss()}function miss(){if(locked)return;locked=true;lives--;streak=0;comboEl.classList.remove('on');drawLives();fx('bad');sfx('bad');haptic('bad');say('NOPE');app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake');lives<=0?setTimeout(gameOver,260):setTimeout(round,260)}function update(){const left=Math.max(0,deadline-performance.now());timerEl.style.transform=`scaleX(${left/duration})`;if(left<=0){if(noTap)surviveNoTap();else miss()}}function surviveNoTap(){if(locked)return;locked=true;clearInterval(tick);score++;streak++;scoreEl.textContent=score;if(score>best){best=score;localStorage.pbBest=best;bestEl.textContent=best}milestoneLife();comboEl.textContent=streak>=3?`×${streak} STREAK`:'';comboEl.classList.toggle('on',streak>=3);fx('good');sfx('good');haptic('good');say('✓');setTimeout(round,85)}function fx(t){flash.className='flash '+t;setTimeout(()=>flash.className='flash',300)}function say(t){toast.textContent=t;toast.className='toast go';setTimeout(()=>toast.className='toast',570)}function fakePopup(){if(locked)return;const f=document.createElement('div');f.className='fake';f.textContent=rand(['TAP ME!','WRONG!','LOOK HERE','BONUS!']);f.style.left=(10+Math.random()*55)+'%';f.style.top=(28+Math.random()*45)+'%';arena.appendChild(f);setTimeout(()=>f.remove(),700)}function gameOver(){clearInterval(tick);locked=true;sfx('death');haptic('death');const record=score>=best&&score>0;overlay.classList.remove('hidden');card.innerHTML=`<h1 class="title">${record?'NEW BEST':'SCORE'}<br><span class="accent">${score}</span></h1><p class="sub">${score>=50?'PANIC ELITE. MELTDOWN SURVIVOR.':score>=25?'FACILITY INTEGRITY CRITICAL.':score>=10?'OPERATOR LOAD ELEVATED.':'OPERATOR FAILED.'}<br><b>Best ${best}</b></p><button class="cta" id="again">AGAIN. NOW.</button><button class="cta secondary" id="challenge">CHALLENGE A FRIEND</button><div class="tiny">Next target: ${score<25?25:score<50?50:100} • same high score saved on this device</div>`;$('#again').onclick=begin;$('#challenge').onclick=share}async function share(){const text=`I survived PANIC BUTTON to ${score}. Beat my score.`;try{if(navigator.share)await navigator.share({title:'PANIC BUTTON',text});else{await navigator.clipboard.writeText(text);say('COPIED')}}catch(e){}}function begin(){deadLightCount=0;[...machineLights.children].forEach(x=>x.className='');damageLabel.classList.remove('on');audioInit();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();app.classList.remove('meltdown');score=0;lives=3;maxLives=3;streak=0;locked=false;scoreEl.textContent=0;drawLives();comboEl.classList.remove('on');overlay.classList.add('hidden');round()}$('#start').onclick=begin})();
